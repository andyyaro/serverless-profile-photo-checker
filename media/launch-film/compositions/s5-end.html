<template>
  <style>
    #root { position: absolute; inset: 0; }
    /* the end card, CERFODES' way: the mark, the wordmark, two short lines with icons; then the URL on the final hit */
    #e-stack { position: absolute; left: 0; right: 0; top: 172px; display: flex; flex-direction: column; align-items: center; }
    #e-mark { width: 184px; height: 184px; }
    #e-word { margin-top: 36px; font-size: 80px; line-height: 92px; font-weight: 700; letter-spacing: -1.3px; color: var(--label-primary); white-space: nowrap; }
    #e-lines { margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .e-l { display: flex; align-items: center; gap: 16px; font-size: 46px; line-height: 56px; font-weight: 600; color: var(--label-primary); white-space: nowrap; }
    .e-l .ic { font-size: 44px; color: var(--label-secondary); }
    #e-url { margin-top: 44px; font-size: 32px; line-height: 40px; font-weight: 500; color: var(--label-secondary); white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s5-end" data-width="1920" data-height="1080">
    <div id="e-stack">
      <div id="e-mark" class="mark"><svg class="ic"><use href="#ic-person-crop-circle" /></svg><span class="badge"><svg class="ic"><use href="#ic-checkmark-circle-fill" /></svg></span></div>
      <div id="e-word">Serverless profile-photo checker</div>
      <div id="e-lines">
        <div class="e-l" id="e-l1"><svg class="ic"><use href="#ic-person-crop-circle" /></svg><span>One face, smiling, eyes open.</span></div>
        <div class="e-l" id="e-l2"><svg class="ic"><use href="#ic-square-3-layers-3d-top-filled" /></svg><span>14 Terraform resources.</span></div>
      </div>
      <div id="e-url">github.com/andyyaro/serverless-profile-photo-checker</div>
    </div>
  </div>
  <script>
    (function () {
      const TM = window.TM, VO = window.VO;
      const S0 = TM.s5[0], S1 = TM.s5[1];
      const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
      const W = (k, w, nth = 0) => {
        const alts = w.split("|");
        for (const exact of [true, false]) {
          let c = 0;
          for (const x of VO[k].words) {
            const t = norm(x.w);
            if (alts.some((a) => (exact ? t === a : t.startsWith(a)))) { if (c === nth) return x.t0 - S0; c++; }
          }
        }
        return VO[k].start - S0;
      };
      const tl = gsap.timeline({ paused: true });
      const Q = (k) => TM.cues[k] - S0;
      // the mark on the track's last full bar; the name with the voice; the two lines; the URL on the final hit
      tl.fromTo("#e-mark", { opacity: 0, scale: 0.88, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: "back.out(1.4)" }, Q("mark_end"));
      tl.fromTo("#e-mark .badge", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, Q("mark_end") + 0.4);
      tl.fromTo("#e-word", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, W("v13", "serverless") - 0.1);
      tl.fromTo("#e-l1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, Q("end_line1"));
      tl.fromTo("#e-l2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, Q("end_line2"));
      tl.fromTo("#e-url", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, Q("url") - 0.03);
      // the picture fades to the background over the last second, with the track's ring-out
      tl.to("#e-stack", { opacity: 0, duration: 1.0, ease: "power1.inOut" }, S1 - S0 - 1.0);
      window.__timelines["s5-end"] = tl;
    })();
  </script>
</template>
