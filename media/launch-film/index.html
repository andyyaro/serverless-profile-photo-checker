    <style>
      /* The system face, exactly as the CERFODES architecture video loads it (Mac only: SF via local()).
         A bare -apple-system/system-ui primary is silently replaced at render time, so it is named through local(). */
      @font-face { font-family: "HostUI"; src: local("SF Pro"), local("SF Pro Display"), local(".SF NS"); font-weight: 100 900; }
      /* HIG Native light tokens (the CERFODES subset of the design system's tokens.json) */
      :root {
        --grouped-background-primary: #f2f2f7;
        --background-primary: #ffffff;
        --label-primary: #000000;
        --label-secondary: #68686d; /* video legibility, as CERFODES: solid, >= 4.5:1 on white and on the grouped background */
        --separator: rgba(0, 0, 0, 0.12);
        --fill-secondary: rgba(120, 120, 128, 0.16);
        --fill-tertiary: rgba(118, 118, 128, 0.12);
        --fill-quaternary: rgba(116, 116, 128, 0.08);
        --system-green: #34c759;
        --system-orange: #ff8d28;
        --system-red: #ff383c;
        --system-gray: #8e8e93;
        --system-gray-3: #c7c7cc;
        --system-blue: #0088ff;
        --system-teal: #00c3d0;
        --system-indigo: #6155f5;
        --radius-group: 26px;
        --radius-capsule: 9999px;
        --font-ui: "HostUI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--grouped-background-primary); }
      #main {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        color: var(--label-primary); font-family: var(--font-ui); -webkit-font-smoothing: antialiased;
      }
      #bg { position: absolute; inset: 0; background: var(--grouped-background-primary); }

      /* ---- shared parts (every scene uses them). One face only: code words are set in the system face too. ---- */
      /* glyphs: 24 x 24 line icons from the sprite, sized by the parent's font-size */
      .ic { display: block; width: 1em; height: 1em; flex: none; overflow: visible; }
      /* section title, top left: bold title + grey subtitle on one baseline */
      .sect { position: absolute; left: 64px; top: 46px; display: flex; align-items: baseline; gap: 18px; white-space: nowrap; }
      .sect b { font-size: 46px; line-height: 56px; font-weight: 700; letter-spacing: -0.4px; color: var(--label-primary); }
      .sect span { font-size: 26px; line-height: 32px; font-weight: 400; color: var(--label-secondary); }
      /* cards: a coloured rounded tile with a white line glyph, a bold title, a grey line; no shadows */
      .card { position: absolute; display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 18px; background: var(--background-primary); }
      .card.v { flex-direction: column; align-items: flex-start; justify-content: center; gap: 12px; }
      .tile { flex: none; width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 26px; }
      .tx { min-width: 0; display: flex; flex-direction: column; }
      .t { font-size: 23px; line-height: 28px; font-weight: 600; color: var(--label-primary); }
      .s { margin-top: 2px; font-size: 18px; line-height: 22px; color: var(--label-secondary); }
      .chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { display: block; padding: 3px 11px; border-radius: var(--radius-capsule); background: var(--fill-tertiary);
              font-size: 18px; line-height: 22px; font-weight: 500; color: var(--label-primary); white-space: nowrap; }
      /* status: always a dot + a word */
      .st { margin-top: 8px; display: flex; align-items: center; gap: 9px; font-size: 22px; line-height: 26px; font-weight: 500; color: var(--label-primary); }
      .dot { display: block; flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--system-gray); }
      .dot.g { background: var(--system-green); }
      .dot.o { background: var(--system-orange); }
      .dot.r { background: var(--system-red); }
      /* the film-only mark: a system-blue tile, a white person glyph, a small green check badge (not a project logo) */
      .mark { position: relative; flex: none; border-radius: 22.5%; background: var(--system-blue); color: #fff; display: flex; align-items: center; justify-content: center; }
      .mark > .ic { width: 62%; height: 62%; }
      .mark .badge { position: absolute; right: -7%; bottom: -7%; width: 38%; height: 38%; border-radius: 50%; background: var(--grouped-background-primary);
                     display: flex; align-items: center; justify-content: center; color: var(--system-green); }
      .mark .badge .ic { width: 86%; height: 86%; --knock: #fff; }

      /* burned-in subtitles (compositions/subs.html, track 9): a dark rounded pill at the bottom; the band y >= 936 stays free of picture */
      #subtitles { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
      .sub {
        position: absolute; left: 0; right: 0; bottom: 30px; margin: 0 auto; width: fit-content; max-width: 1240px;
        padding: 8px 26px 10px; border-radius: 18px; background: rgba(0, 0, 0, 0.74); color: #ffffff; white-space: pre-line;
        font-size: 38px; line-height: 47px; font-weight: 500; letter-spacing: -0.1px; text-align: center;
      }
    </style>
